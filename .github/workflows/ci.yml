name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax + bundle check
        run: npm run check
      - name: Migrations apply and seed loads
        run: |
          npm run db:migrate:local
          npm run db:seed:local
      - name: End-to-end smoke test (sign-in, admin API, security rules)
        run: |
          printf 'ADMIN_EMAILS=smoke-admin@example.com\nDEV_ECHO_LINK=1\n' > .dev.vars
          npx wrangler dev --port 8799 > dev.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8799/api/health && break; sleep 2; done
          node scripts/smoke.mjs || { cat dev.log; exit 1; }
