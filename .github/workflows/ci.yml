name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax + bundle check
        run: npm run check
      - name: Migrations apply and seed loads
        run: |
          npm run db:migrate:local
          npm run db:seed:local
