name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax + bundle check
        run: npm run check
      - name: Migrations apply and seed loads
        run: |
          npm run db:migrate:local
          npm run db:seed:local
      - name: End-to-end smoke test (sign-in, admin API, security rules)
        timeout-minutes: 5
        env:
          WRANGLER_SEND_METRICS: "false"
          CI: "true"
        run: |
          printf 'ADMIN_EMAILS=smoke-admin@example.com\nDEV_ECHO_LINK=1\n' > .dev.vars
          # Run the dev server fully detached and always stop it, so the step can finish.
          nohup npx wrangler dev --ip 127.0.0.1 --port 8799 --log-level debug > dev.log 2>&1 < /dev/null &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true; pkill -f workerd 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 25); do
            if curl -sf --max-time 3 http://127.0.0.1:8799/api/health > /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then echo "--- dev server never became ready; its log: ---"; tail -n 120 dev.log; exit 1; fi
          BASE=http://127.0.0.1:8799 node scripts/smoke.mjs || { echo "--- dev server log ---"; tail -n 120 dev.log; exit 1; }
